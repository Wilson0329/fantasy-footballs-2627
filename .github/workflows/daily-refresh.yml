name: Daily data refresh

on:
  # Re-enabled for the live 2026/27 season (was paused for the off-season). The
  # league/cup builds pass --league-id so they need no secrets. Two off-peak,
  # non-round-minute slots a day for reliability — GitHub often drops runs that
  # land on the exact hour. 06:41 UTC catches finalised data after the overnight
  # bonus processing; 17:11 UTC refreshes again after the day's matches.
  # (The podcast is produced locally and is not part of this workflow.)
  schedule:
    - cron: '41 6 * * *'
    - cron: '11 17 * * *'
  workflow_dispatch: # manual trigger from the GitHub Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests firebase-admin

      # League + cup builds pass the league id directly so they run WITHOUT
      # Firestore/FIREBASE_SERVICE_ACCOUNT. Standings stay empty (front-end shows
      # the "season starting" placeholder) until GW1 completes, then fill in
      # automatically. Change LEAGUE_ID / SEASON here at the start of each season.
      - name: Rebuild league data
        run: python3 build_league_data.py --league-id 271949 --season "2026/27" --output docs/league_data.json

      - name: Rebuild cup data
        run: python3 build_cup_data.py --league-id 271949 --season "2026/27" --output docs/cup_data.json
        continue-on-error: true

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/league_data.json docs/cup_data.json
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "chore: daily data refresh $(date -u +%Y-%m-%d)"
            git push
          fi
